<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/logo.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfdfd" />
    <script>
      (() => {
        let theme
        try { theme = localStorage.getItem('animeflow-theme') } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0b1418' : '#fbfdfd'
      })()
    </script>
    <meta
      name="description"
      content="AnimeFlow 官网，提供官方下载安装入口与项目介绍。开源跨平台动漫追番播放器，支持多数据源、Anime4K 实时超分、弹幕与 Bangumi 收藏同步。"
    />
    <title>AnimeFlow 官网 - 官方下载与项目介绍 | 跨平台动漫追番播放器</title>
    <!--seo-head-->
  </head>
  <body>
    <div id="app"><!--ssr-outlet--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
